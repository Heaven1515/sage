name: Release SAGE

# Se activa cuando subes un tag con formato v1.2.3
# Ejemplo: git tag v5.0.1 && git push origin v5.0.1
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      # ── 1. Descargar el código ──────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Configurar Python ───────────────────────────────────────────────
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependencias Python
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pyinstaller

      # ── 3a. Crear BD plantilla (notaria.db) para que PyInstaller la bundle ──
      # El spec incluye notaria.db como dato inicial. No está en el repo (.gitignore),
      # así que la generamos aquí con todas las tablas vacías.
      # En el primer arranque del exe, database.py la copia a %APPDATA%\SAGE\.
      - name: Crear BD plantilla
        run: |
          cd backend
          python crear_bd_plantilla.py

      # ── 3b. Instalar Tesseract OCR (se bundlea dentro de backend.exe) ────────
      - name: Instalar Tesseract OCR
        run: choco install tesseract --yes

      - name: Descargar datos idioma español para Tesseract
        run: Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata/raw/main/spa.traineddata" -OutFile "C:\Program Files\Tesseract-OCR\tessdata\spa.traineddata"

      - name: Copiar spa.traineddata al backend
        run: Copy-Item "C:\Program Files\Tesseract-OCR\tessdata\spa.traineddata" backend\spa.traineddata

      # ── 3c. Compilar backend Python → backend.exe ─────────────────────────
      - name: Compilar backend con PyInstaller
        run: |
          cd backend
          pyinstaller sage_backend.spec --clean

      - name: Copiar backend.exe a binarios de Tauri
        run: |
          New-Item -ItemType Directory -Force -Path frontend\src-tauri\binaries
          Copy-Item backend\dist\backend.exe frontend\src-tauri\binaries\backend-x86_64-pc-windows-msvc.exe

      # ── 4. Configurar Node.js + pnpm ───────────────────────────────────────
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # npm (no pnpm) instala directo en frontend/node_modules ignorando el
      # workspace. Las versiones de @tauri-apps/api y @tauri-apps/cli están
      # pinadas exactas en package.json así que no hay riesgo de mismatch.
      - name: Instalar dependencias frontend
        working-directory: frontend
        run: npm install

      # ── 5. Configurar Rust ─────────────────────────────────────────────────
      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}

      # ── 6. Construir y publicar con Tauri ──────────────────────────────────
      - name: Build Tauri
        working-directory: frontend
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Publicar release y latest.json
        shell: pwsh
        run: |
          $tag     = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $nsis    = "frontend\src-tauri\target\release\bundle\nsis"
          $zip     = "$nsis\SAGE_${version}_x64-setup.nsis.zip"
          $sig     = "$nsis\SAGE_${version}_x64-setup.nsis.zip.sig"
          $exe     = "$nsis\SAGE_${version}_x64-setup.exe"

          # Generar latest.json para el auto-updater
          $signature = (Get-Content $sig -Raw).Trim()
          $latest = [ordered]@{
            version  = $version
            notes    = "Nueva versión de SAGE."
            pub_date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url = "https://github.com/Heaven1515/sage/releases/download/$tag/SAGE_${version}_x64-setup.nsis.zip"
              }
            }
          } | ConvertTo-Json -Depth 5
          $latest | Out-File -FilePath "latest.json" -Encoding utf8NoBOM

          # Crear release y subir todos los assets de una vez
          gh release create $tag $exe $zip $sig "latest.json" `
            --title "SAGE $tag" `
            --notes "Nueva versión de SAGE. Descarga el instalador y ejecuta para actualizar."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
